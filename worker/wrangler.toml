name = "family-dashboard-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
# Never delete settings added in the Cloudflare dashboard on deploy.
keep_vars = true

# Non-secret settings. Secrets (GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET,
# GOOGLE_REFRESH_TOKEN, SETUP_KEY, DEVICE_KEYS) are set in the Cloudflare
